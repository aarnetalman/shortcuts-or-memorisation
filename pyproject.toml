[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nlicorrupt"
version = "0.1.0"
description = "Data corruption diagnostics for NLI and GLUE tasks with encoders and LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aarne Talman" }, { name = "Stergios Chatzikyriakidis" }]
# Exact pins live in requirements.txt. Ranges here only keep `pip install -e .`
# from pulling incompatible majors on top of a preinstalled PyTorch.
dependencies = [
    "nltk>=3.9",
    "datasets>=4",
    "pyyaml>=6",
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.4",
]

[project.optional-dependencies]
train = ["transformers>=5.15", "accelerate>=1.0", "huggingface_hub>=0.30"]
analysis = ["pandas>=2", "matplotlib>=3.8"]
dev = ["pytest>=8"]

[project.scripts]
nlicorrupt = "nlicorrupt.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
nlicorrupt = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: needs Hugging Face hub access (deselect with -m 'not network')",
    "slow: takes more than a few seconds",
]
